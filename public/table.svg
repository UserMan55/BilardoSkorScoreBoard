<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!-- Masa Çerçevesi -->
  <rect x="10" y="10" width="180" height="100" rx="5" fill="#3e2723" />
  
  <!-- Yeşil Çuha -->
  <rect x="20" y="20" width="160" height="80" rx="2" fill="#1b5e20" />
  
  <!-- Delikler (Cepler - Sembolik) -->
  <circle cx="20" cy="20" r="4" fill="#000" opacity="0.6"/>
  <circle cx="180" cy="20" r="4" fill="#000" opacity="0.6"/>
  <circle cx="20" cy="100" r="4" fill="#000" opacity="0.6"/>
  <circle cx="180" cy="100" r="4" fill="#000" opacity="0.6"/>
  <circle cx="100" cy="18" r="4" fill="#000" opacity="0.6"/>
  <circle cx="100" cy="102" r="4" fill="#000" opacity="0.6"/>

  <!-- Toplar (3 Bant) -->
  <!-- Beyaz -->
  <circle cx="60" cy="60" r="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <!-- Sarı -->
  <circle cx="120" cy="40" r="5" fill="#ffeb3b" stroke="#fbc02d" stroke-width="1"/>
  <!-- Kırmızı -->
  <circle cx="140" cy="80" r="5" fill="#d32f2f" stroke="#b71c1c" stroke-width="1"/>
  
  <!-- Istaka (Opsiyonel) -->
  <line x1="40" y1="110" x2="160" y2="10" stroke="#d7ccc8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>